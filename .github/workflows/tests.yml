name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole grid, on pull requests and when run by hand before a tag. A push to main runs only `newest`.
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        deps: [prefer-lowest, prefer-stable]
        suggested: [with]
        exclude:
          # Laravel 13 needs PHP 8.3.
          - { php: '8.2', laravel: '13.*' }
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # laravel/pulse, laravel/horizon and sentry/sentry-laravel are suggestions, so the suite has to pass without them too.
          - { php: '8.5', laravel: '13.*', testbench: '11.*', deps: prefer-stable, suggested: without }

    name: &name PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.deps }} · ${{ matrix.suggested }} suggested

    steps: &steps
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - if: matrix.suggested == 'without'
        run: composer remove --dev laravel/pulse sentry/sentry-laravel laravel/horizon --no-update --no-interaction

      # Testbench picks the Laravel major; prefer-lowest installs composer.json's own floors.
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      # The lowest legs install the declared Laravel floors, which have security advisories; malware and
      # abandoned-package blocking stay on.
      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.deps == 'prefer-lowest' && '0' || '1' }}

      - if: matrix.php == '8.5' && matrix.laravel == '13.*' && matrix.deps == 'prefer-stable' && matrix.suggested == 'with'
        run: vendor/bin/pint --test

      - if: matrix.php == '8.5' && matrix.laravel == '13.*' && matrix.deps == 'prefer-stable' && matrix.suggested == 'with'
        run: composer analyse

      - run: vendor/bin/phpunit

  # A push to main: the grid's newest row, which also runs the rest of the check.
  newest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { php: '8.5', laravel: '13.*', testbench: '11.*', deps: prefer-stable, suggested: with }
    name: *name
    steps: *steps
